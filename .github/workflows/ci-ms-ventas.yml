
name: CI-CD MS Ventas

on:
  push:
    branches:
      - main
      - feature/ci-ms-ventas
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    name: Pruebas de MS Ventas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ms-ventas/package-lock.json

      - name: Instalar dependencias
        working-directory: ms-ventas
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: ms-ventas
        run: npm test

  publicar:
    name: Publicar imagen en Docker Hub
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./ms-ventas
          push: true
          tags: |
            felipegonzalezc540/tienda-ropa-ms-ventas:latest
            felipegonzalezc540/tienda-ropa-ms-ventas:${{ github.sha }}
